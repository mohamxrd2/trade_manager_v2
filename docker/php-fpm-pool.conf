; Remplace le pool par défaut de l'image officielle php:8.2-fpm
; (/usr/local/etc/php-fpm.d/www.conf), qui écoute en TCP sur le port 9000
; par défaut. On bascule sur un socket Unix : Nginx et PHP-FPM tournent
; dans le même conteneur, un socket est plus rapide et évite d'exposer un
; port TCP interne inutile.

[www]
user = www-data
group = www-data

; Chemin identique à celui référencé dans docker/nginx.conf.template
; (fastcgi_pass unix:/run/php-fpm.sock) — les deux fichiers doivent rester
; synchronisés si ce chemin change un jour.
listen = /run/php-fpm.sock
; Le process nginx (paquet Debian, "user www-data;" par défaut, non modifié
; ici) doit pouvoir se connecter au socket : même utilisateur/groupe.
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Valeurs reprises du pool par défaut de l'image officielle (www.conf
; d'origine : pm.max_children=5, start_servers=2, min/max_spare=1/3) — les
; seuls changements sont le mode d'écoute (socket) et pm.max_requests
; (recyclage périodique des workers, pratique standard pour limiter les
; fuites mémoire progressives). À ajuster selon le plan Render réel une
; fois la RAM disponible confirmée.
pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
; Filet de sécurité : tue un worker bloqué au-delà de 60s (timeout d'un
; reverse proxy typique), pour qu'il soit recyclé plutôt que de rester
; indéfiniment bloqué à consommer un slot sur seulement 5 workers
; disponibles. Sans effet sur une requête normale, qui répond en quelques
; centaines de ms au pire (mesuré : ~340ms pour /api/auth/google/redirect).
request_terminate_timeout = 60s

; Explicite plutôt qu'implicite : seuls les fichiers .php sont exécutables
; via FastCGI, quel que soit le SCRIPT_FILENAME transmis par Nginx — déjà
; la valeur par défaut de PHP-FPM, documenté ici pour qu'elle ne dépende
; pas d'un défaut implicite non visible dans ce fichier.
security.limit_extensions = .php

; Logs vers stdout/stderr plutôt qu'un fichier, cohérent avec le choix déjà
; fait pour les logs applicatifs (LOG_STACK=stderr) et les logs Nginx
; (docker/nginx.conf.template) — capturés par les Runtime Logs Render.
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on

; Requêtes PHP individuelles dépassant 5s : loguées séparément avec leur
; stack trace, pour isoler précisément quel appel PHP traîne (complémentaire
; au log d'accès Nginx, qui ne mesure que le temps total réseau inclus).
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
