; Réglages PHP de production (copiés dans conf.d par le Dockerfile).
; Cohérents avec Nginx (docker/nginx.conf.template) et PHP-FPM
; (docker/php-fpm-pool.conf) : PHP s'arrête le premier (55 s), puis
; PHP-FPM (60 s), puis Nginx (65 s) — une requête trop longue renvoie
; donc une erreur de Laravel ou de Nginx, toujours avec les en-têtes CORS.

; Envoi d'images : 5 Mo côté Laravel (config/media.php) + marge.
upload_max_filesize = 6M
post_max_size = 8M

max_execution_time = 55
memory_limit = 256M
expose_php = Off
