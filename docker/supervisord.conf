; Supervisor pilote deux process dans le même conteneur (Nginx + PHP-FPM) —
; un conteneur Docker n'a normalement qu'un seul process au premier plan,
; Supervisor comble ce besoin et redémarre automatiquement un process qui
; crashe (résilience que php artisan serve seul n'offrait pas).

[supervisord]
; nodaemon=true : Supervisor lui-même reste au premier plan (PID 1, lancé
; via `exec supervisord` dans docker/entrypoint.sh) — sinon il forkerait en
; arrière-plan et le conteneur s'arrêterait immédiatement faute de process
; au premier plan.
nodaemon=true
user=root

[program:php-fpm]
; -F : force l'exécution au premier plan, explicite plutôt que de dépendre
; d'un réglage implicite (daemonize) hérité de l'image de base.
command=php-fpm -F
priority=1
autostart=true
autorestart=true
startsecs=1
; Le pool (docker/php-fpm-pool.conf) redirige déjà ses propres logs vers
; /proc/self/fd/2 (stderr) ; ces lignes sont un filet de sécurité pour
; capturer toute sortie qui échapperait à cette config (ex: erreurs très
; précoces avant l'ouverture du error_log), pour qu'elle atteigne quand
; même les Runtime Logs Render au lieu du fichier de log interne par
; défaut de Supervisor. maxbytes=0 : désactive la rotation de Supervisor,
; incompatible avec un device spécial comme /dev/stdout.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
; -g "daemon off;" : force Nginx au premier plan (même principe que -F pour
; PHP-FPM), indépendamment de la directive "daemon" du nginx.conf hérité
; du paquet Debian. C'est l'approche documentée par l'image officielle
; nginx elle-même.
command=nginx -g "daemon off;"
priority=2
autostart=true
autorestart=true
startsecs=1
; Même remarque que pour php-fpm : docker/nginx.conf.template redirige déjà
; access_log/error_log vers /dev/stdout et /dev/stderr ; filet de sécurité
; identique ici.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
